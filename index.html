<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09070a">
<title>人生の手札診断</title>
<style>
:root{
  --bg:#09070a; --panel:#151017; --gold:#e8bd61; --gold2:#fff0b0;
  --red:#a30f22; --ink:#f8f1e5; --muted:#bdb3a5;
}
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
  background:
    radial-gradient(circle at 50% 0%,#40101b 0,transparent 34%),
    radial-gradient(circle at 20% 70%,#211425 0,transparent 34%),
    linear-gradient(180deg,#080608,#100a0e 55%,#050405);
}
.wrap{width:min(980px,100%);margin:auto;padding:24px 16px 64px;text-align:center}
.hero{padding:26px 10px 10px}
.kicker{letter-spacing:.24em;color:var(--gold);font-size:.78rem;font-weight:800}
h1{font-family:Georgia,"Yu Mincho",serif;font-size:clamp(2.2rem,10vw,4.8rem);margin:.18em 0 .08em;color:#fff4ce;text-shadow:0 0 25px #a20f26}
.lead{margin:0 auto;max-width:620px;color:#ddd0bd;line-height:1.8}
.quote{margin:18px auto 6px;color:var(--gold2);font-weight:800}
.btn{
  border:1px solid #f0ca73;border-radius:999px;padding:14px 24px;
  background:linear-gradient(180deg,#a9162d,#650815);color:#fff6dc;
  font-size:1rem;font-weight:900;box-shadow:0 8px 26px #0008, inset 0 0 12px #ffb05d33;
  cursor:pointer
}
.btn.secondary{background:#171117;color:#ead8ae}
.hidden{display:none!important}
#intro .mascot{width:min(230px,58vw);height:230px;object-fit:contain;margin:12px auto;display:block}
.stage{margin-top:22px}
.instruction{font-weight:900;color:#f8e5b0;margin-bottom:14px}
.counter{color:var(--gold);margin-bottom:12px;font-weight:800}
.deck{
  display:grid;grid-template-columns:repeat(6,1fr);gap:8px;
  max-width:690px;margin:0 auto
}
.pick{
  aspect-ratio:2/3;border:0;padding:0;border-radius:9px;overflow:hidden;
  background:#20161b;box-shadow:0 5px 14px #000a;cursor:pointer;
  transition:.2s transform,.2s filter,.2s opacity
}
.pick img{width:100%;height:100%;object-fit:cover;display:block}
.pick:hover{transform:translateY(-5px)}
.pick.chosen{filter:brightness(.35);transform:scale(.94);pointer-events:none}
.pick.chosen:after{content:"✓";position:absolute}
@media(max-width:620px){.deck{grid-template-columns:repeat(5,1fr);gap:6px}.wrap{padding-inline:10px}}
.results{margin-top:28px}
.results h2{font-family:Georgia,"Yu Mincho",serif;color:#ffe5a3;font-size:2rem}
.hand{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:stretch}
@media(max-width:760px){.hand{grid-template-columns:1fr}}
.result{
  background:linear-gradient(180deg,#1d151b,#0d0a0c);
  border:1px solid #6f5530;border-radius:20px;padding:16px;
  box-shadow:0 12px 32px #0009;position:relative;overflow:hidden
}
.slot{color:#d7b96d;font-size:.8rem;font-weight:900;letter-spacing:.12em}
.face{
  width:min(190px,70%);aspect-ratio:2/3;margin:12px auto;border-radius:13px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:#f8f2e7;color:#171015;border:5px double #c89a3d;
  box-shadow:0 7px 18px #0008;position:relative
}
.face.red{color:#a40d20}
.face .rank{font-family:Georgia,serif;font-size:4rem;font-weight:900;line-height:.9}
.face .suit{font-size:3.4rem;line-height:1}
.face.joker{padding:0;border:0;background:#000}
.face.joker img{width:100%;height:100%;object-fit:cover;border-radius:13px}
.power{color:#d5bc7e;font-size:.85rem;font-weight:900}
.result h3{font-size:1.35rem;margin:.4em 0;color:#fff0bf}
.reading{line-height:1.75;color:#eee2d4;text-align:left}
.use{background:#21151a;border-left:3px solid var(--gold);padding:10px 12px;border-radius:8px;text-align:left;line-height:1.6}
.bad{margin-top:12px;padding:12px;border-radius:12px;background:#340b13;text-align:left;line-height:1.6}
.bad b{color:#ffb0b9}
.summary{
  margin:20px auto 0;max-width:720px;padding:20px;border:1px solid #9b7437;
  border-radius:18px;background:#100c0e
}
.duo{display:flex;justify-content:center;align-items:end;gap:6px;margin-top:14px}
.duo img{height:130px;max-width:42%;object-fit:contain}
.final{font-size:1.25rem;font-weight:900;line-height:1.8}
.error{
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  color:#ff465f;letter-spacing:.1em;font-weight:900
}
footer{margin-top:36px;color:#776f68;font-size:.72rem}

/* --- UMEKO upgrade: shuffle / flip / sparkle / save --- */
.sparkles{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.spark{position:absolute;width:5px;height:5px;background:#ffe9a4;transform:rotate(45deg);
  box-shadow:0 0 8px #fff1a8,0 0 18px #dca52e;animation:twinkle var(--d) ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.05;transform:scale(.35) rotate(45deg)}50%{opacity:1;transform:scale(1.7) rotate(45deg)}}
.shuffler{max-width:700px;margin:12px auto 22px;padding:18px;border:1px solid #6f5530;border-radius:18px;background:#100b0e}
.shuffle-zone{height:210px;position:relative;display:grid;place-items:center;perspective:900px}
.shuffle-card{position:absolute;width:112px;aspect-ratio:2/3;border-radius:10px;overflow:hidden;box-shadow:0 9px 25px #000b;transition:.18s}
.shuffle-card img{width:100%;height:100%;object-fit:cover}
.shuffler.go .c1{animation:mix1 1.15s ease-in-out}
.shuffler.go .c2{animation:mix2 1.15s ease-in-out}
.shuffler.go .c3{animation:mix3 1.15s ease-in-out}
.shuffler.go .c4{animation:mix4 1.15s ease-in-out}
.shuffler.go .c5{animation:mix5 1.15s ease-in-out}
@keyframes mix1{20%{transform:translate(-115px,-20px) rotate(-18deg)}55%{transform:translate(85px,20px) rotate(12deg)}100%{transform:none}}
@keyframes mix2{20%{transform:translate(105px,-15px) rotate(16deg)}55%{transform:translate(-80px,28px) rotate(-11deg)}100%{transform:none}}
@keyframes mix3{25%{transform:translate(-65px,38px) rotate(-9deg)}60%{transform:translate(120px,-22px) rotate(20deg)}100%{transform:none}}
@keyframes mix4{25%{transform:translate(75px,42px) rotate(10deg)}60%{transform:translate(-120px,-25px) rotate(-20deg)}100%{transform:none}}
@keyframes mix5{35%{transform:translateY(-45px) rotate(180deg)}75%{transform:translateY(25px) rotate(360deg)}100%{transform:none}}
.pick{position:relative}
.pick::before{content:"";position:absolute;inset:-80% -120%;background:linear-gradient(115deg,transparent 42%,#fff8cfdd 49%,transparent 56%);transform:translateX(-60%);transition:.2s;z-index:2}
.pick:hover::before{animation:cardshine .75s ease}
@keyframes cardshine{to{transform:translateX(65%)}}
.reveal-overlay{position:fixed;inset:0;z-index:80;background:#050306eF;display:grid;place-items:center;padding:20px}
.reveal-card{width:min(330px,78vw);aspect-ratio:2/3;perspective:1200px;filter:drop-shadow(0 0 30px #b11234)}
.reveal-inner{width:100%;height:100%;position:relative;transform-style:preserve-3d;animation:flipwow 1.15s cubic-bezier(.2,.8,.2,1) forwards}
.reveal-side{position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;overflow:hidden;box-shadow:0 0 55px #e7bd5b99}
.reveal-back img,.reveal-joker img{width:100%;height:100%;object-fit:cover}
.reveal-front{transform:rotateY(180deg);background:radial-gradient(circle,#fffaf0,#e9dcc4);display:flex;align-items:center;justify-content:center;border:8px double #c99a3c}
.reveal-front.red{color:#a40d20}.reveal-front.black{color:#111}
.reveal-front .big{font-family:Georgia,serif;font-size:clamp(5rem,25vw,8rem);font-weight:900;line-height:.8}
.reveal-front .bigSuit{font-size:clamp(4rem,20vw,7rem);line-height:1}
@keyframes flipwow{0%{transform:rotateY(0) scale(.75)}45%{transform:rotateY(540deg) scale(1.08)}100%{transform:rotateY(900deg) scale(1)}}
.flash{position:fixed;inset:0;z-index:79;pointer-events:none;background:radial-gradient(circle,#fff9d8 0,#d9a63088 15%,transparent 50%);animation:flash .9s ease forwards}
@keyframes flash{0%{opacity:0}35%{opacity:1}100%{opacity:0}}
.result{animation:rise .6s ease both}
.result:nth-child(2){animation-delay:.12s}.result:nth-child(3){animation-delay:.24s}
@keyframes rise{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
.result::after{content:"";position:absolute;top:-70%;left:-120%;width:80%;height:240%;background:linear-gradient(100deg,transparent,#fff2a72b,transparent);transform:rotate(15deg);animation:sweep 4s ease-in-out infinite}
@keyframes sweep{0%,55%{left:-120%}85%,100%{left:160%}}
.action-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.save-note{font-size:.75rem;color:#aa9d8b;margin-top:8px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}
</style>
</head>
<body><div class="sparkles" id="sparkles"></div>
<main class="wrap">
<section id="intro" class="hero">
  <div class="kicker">UMEKO ORIGINAL CARD DIAGNOSIS</div>
  <h1>人生の手札診断</h1>
  <p class="lead">配られたカードに文句言う前に、手札見よか。<br>直感で3枚。あんたが持ってる武器、腐らせてる武器、最後の切り札を暴きます。</p>
  <img class="mascot" src="umeko.PNG" alt="うめこ">
  <div class="quote">配られたカードは変えられへん。<br>でも、切り方はあんた次第。</div>
  <button class="btn" id="start">手札を配ってもらう</button>
</section>

<section id="game" class="stage hidden">
  <div class="shuffler" id="shuffler">
    <div class="instruction">まずは54枚、派手に混ぜます。</div>
    <div class="shuffle-zone">
      <div class="shuffle-card c1"><img src="card_back.PNG"></div>
      <div class="shuffle-card c2"><img src="card_back.PNG"></div>
      <div class="shuffle-card c3"><img src="card_back.PNG"></div>
      <div class="shuffle-card c4"><img src="card_back.PNG"></div>
      <div class="shuffle-card c5"><img src="card_back.PNG"></div>
    </div>
    <button class="btn" id="shuffleBtn">🃏 シャッフルする</button>
  </div>
  <div id="pickArea" class="hidden">
    <div class="instruction">考えすぎ禁止。直感で3枚選んでな。</div>
    <div class="counter" id="counter">0 / 3 枚</div>
    <div class="deck" id="deck"></div>
  </div>
</section>

<section id="results" class="results hidden">
  <div class="kicker">YOUR HAND</div>
  <h2>あんたの人生の手札</h2>
  <div class="hand" id="hand"></div>
  <div class="summary" id="summary"></div>
  <div class="action-row">
    <button class="btn" id="saveResult">結果を画像保存</button>
    <button class="btn secondary" id="again">もう一回、配り直す</button>
  </div>
  <div class="save-note">画像は 1080×1350px のPNGで保存されます。</div>
</section>
<footer>※遊びとして楽しむオリジナル診断です。結果は人生の決定を代わりにするものではありません。</footer>
</main>

<script>

["5","変える","違和感破壊者","『当たり前』を疑い、より良い答えへ切り替えられる。","古いやり方を見直す時。","何でも疑ったら説明書まで敵になるで"],
["6","育てる","知恵の錬成師","経験から学びを抽出し、次の判断に活かせる。","失敗や経験を次へつなげる時。","黒歴史まで教材にすな"],
["7","掘る","深層ダイバー","表面では満足せず、物事の奥にある理由まで探れる。","原因や本音を深く知る必要がある時。","深いねん。もう海底や。帰ってこい"],
["8","動かす","一手先の策士","状況を読み、最も効果的な一手を選んで動ける。","無駄打ちせず一手を選びたい時。","読みすぎて相手まだ何もしてへん"],
["9","極める","本質鑑定人","経験と洞察を重ね、余計なものに惑わされなくなる。","情報が多すぎる中で核心を見たい時。","一発で見抜いても、顔に出すな"],
["10","完成させる","答えを出す人","複雑な状況を整理し、最後に一つの結論へ導ける。","考え続ける段階を終えて決める時。","答え出すん早いねん。みんなまだ説明中や"],
["J","攻める","矛盾狩り","おかしな点を恐れず突き、突破口を見つける。","矛盾や問題を曖昧にできない時。","正論という名の鈍器を置け"],
["Q","魅せる","静謐のカリスマ","多くを語らずとも、洞察と存在感で人を惹きつける。","言葉を重ねず存在感で示したい時。","黙ってたら全部分かってる風に見える。得やな"],
["K","率いる","盤上の支配者","全体を俯瞰し、先を読みながら最善の方向へ導く。","複雑な状況全体を見て舵を取る時。","全部読めても、人間は予定通り動かんで。"]
]};
const jokerData=[
 {id:"RJ",name:"RED JOKER",title:"予定調和破壊者",power:"分類：知らん。枠に入らん。",reading:"決められた道を上手に歩くより、道そのものを作り替える力を持つ札。人と同じやり方では力が出にくく、「そんなやり方アリなん？」から結果を作る。",use:"行き詰まった時。常識通りにやっても面白くない時。ゼロから何か生み出す時。",bad:"普通になろうとしてたん？ 無理やで。",img:IMG.redJoker},
 {id:"BJ",name:"BLACK JOKER",title:"大逆転者",power:"分類：土壇場専門。",reading:"順調な時より「もうアカン」から異様に強い札。想定外・失敗・予定変更すら材料にして、最後にひっくり返す力を持つ。",use:"計画が崩れた時。選択肢がなくなった時。「もうこれしかない」になった時。",bad:"最初から本気出せ。毎回崖っぷち待つな。",img:IMG.blackJoker}
];

let cards=[];
for(const suit of Object.keys(data)){
  data[suit].forEach(x=>cards.push({
    id:suit+x[0], suit, rank:x[0], action:x[1], title:x[2],
    reading:x[3], use:x[4], bad:x[5], power:suitInfo[suit].power
  }));
}
cards.push(...jokerData);
let shuffled=[],selected=[];

const $=s=>document.querySelector(s);
function shuffle(a){
  a=[...a];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
  return a;
}
function deal(){
  selected=[]; shuffled=shuffle(cards);
  $("#results").classList.add("hidden"); $("#game").classList.remove("hidden");
  $("#pickArea").classList.add("hidden"); $("#shuffler").classList.remove("hidden","go");
  $("#counter").textContent="0 / 3 枚";
  const deck=$("#deck"); deck.innerHTML="";
  shuffled.forEach((card,i)=>{
    const b=document.createElement("button");
    b.className="pick"; b.setAttribute("aria-label",`${i+1}枚目のカード`);
    b.innerHTML=`<img src="${IMG.back}" alt="伏せたカード">`;
    b.onclick=()=>{
      if(selected.length>=3 || b.classList.contains("chosen")) return;
      b.classList.add("chosen"); selected.push(card);
      $("#counter").textContent=`${selected.length} / 3 枚`;
      revealCard(card, selected.length, ()=>{ if(selected.length===3) setTimeout(showResults,220); });
    };
    deck.appendChild(b);
  });
}
function face(c){
  if(c.id==="RJ"||c.id==="BJ") return `<div class="face joker"><img src="${c.img}" alt="${c.name}"></div>`;
  const cls=suitInfo[c.suit].color==="red"?" red":"";
  return `<div class="face${cls}"><div class="rank">${c.rank}</div><div class="suit">${c.suit}</div></div>`;
}

function burstSparkles(){
  const flash=document.createElement("div"); flash.className="flash"; document.body.appendChild(flash);
  setTimeout(()=>flash.remove(),950);
}
function revealCard(c,n,done){
  burstSparkles();
  const o=document.createElement("div"); o.className="reveal-overlay";
  let front;
  if(c.id==="RJ"||c.id==="BJ"){
    front=`<div class="reveal-side reveal-front reveal-joker"><img src="${c.img}" alt="${c.name}"></div>`;
  }else{
    const col=suitInfo[c.suit].color;
    front=`<div class="reveal-side reveal-front ${col}"><div><div class="big">${c.rank}</div><div class="bigSuit">${c.suit}</div></div></div>`;
  }
  o.innerHTML=`<div><div class="slot" style="margin-bottom:12px">${n}枚目</div><div class="reveal-card"><div class="reveal-inner"><div class="reveal-side reveal-back"><img src="${IMG.back}"></div>${front}</div></div><div style="margin-top:18px;color:#ffe6a4;font-weight:900">めくったで。</div></div>`;
  document.body.appendChild(o);
  setTimeout(()=>{o.style.transition=".3s";o.style.opacity="0";setTimeout(()=>{o.remove();done&&done()},300)},1550);
}
function makeSparkles(){
  const box=$("#sparkles");
  for(let i=0;i<30;i++){
    const x=document.createElement("i"); x.className="spark";
    x.style.left=Math.random()*100+"%"; x.style.top=Math.random()*100+"%";
    x.style.setProperty("--d",(1.4+Math.random()*3)+"s");
    x.style.animationDelay=(-Math.random()*3)+"s";
    box.appendChild(x);
  }
}
makeSparkles();

function showResults(){
  $("#game").classList.add("hidden"); $("#results").classList.remove("hidden");
  const slots=["生まれつき持ってる札","なぜか腐らせてる札","人生の切り札"];
  $("#hand").innerHTML=selected.map((c,i)=>`
    <article class="result">
      <div class="slot">${i+1}｜${slots[i]}</div>
      ${face(c)}
      <div class="power">${c.id==="RJ"||c.id==="BJ"?c.power:`${c.power} × ${c.action}`}</div>
      <h3>${c.title}</h3>
      <p class="reading">${c.reading}</p>
      <div class="use"><b>この札の使いどころ</b><br>${c.use}</div>
      <div class="bad"><b>😈 悪いうめこの余計な一言</b><br>${c.bad}</div>
    </article>`).join("");
  const jokers=selected.filter(c=>c.id==="RJ"||c.id==="BJ");
  let text=`<div class="final">あんた、ええ手札持ってるやん。<br><span style="color:#f3ca70">ほな、いつ切るん？</span></div>`;
  if(jokers.length===1){
    const pos=selected.indexOf(jokers[0]);
    const msg=[
      "そもそも規格外。最初から人と同じ型に入れんでよろしい。",
      "自分を普通の枠に収めようとして、その札を腐らせてる可能性あり。",
      "最後は予定通りに勝とうとせんでええ。ひっくり返すのが切り札や。"
    ][pos];
    text=`<div class="error">SYSTEM ERROR<br>この人、分類できません。</div><p class="final">${msg}<br>悪いうめこ「知らん。好きにせぇ。」</p>`;
  }else if(jokers.length===2){
    text=`<div class="error">判 定 不 能</div><p class="final">JOKER 2枚引き。<br><b>うめこにも手ぇ負えません。</b></p>`;
  }
  $("#summary").innerHTML=text+`<div class="duo"><img src="${IMG.normal}" alt="うめこ"><img src="${IMG.bad}" alt="悪いうめこ"></div>`;
  window.scrollTo({top:$("#results").offsetTop-10,behavior:"smooth"});
}

$("#shuffleBtn").onclick=()=>{
  const z=$("#shuffler"); z.classList.remove("go"); void z.offsetWidth; z.classList.add("go");
  shuffled=shuffle(cards);
  burstSparkles();
  setTimeout(()=>{
    z.classList.add("hidden"); $("#pickArea").classList.remove("hidden");
    $("#pickArea").scrollIntoView({behavior:"smooth",block:"start"});
  },1200);
};

function wrapText(ctx,text,x,y,maxWidth,lineHeight,maxLines=4){
  let line="", lines=[];
  for(const ch of text){
    const test=line+ch;
    if(ctx.measureText(test).width>maxWidth && line){lines.push(line);line=ch}else line=test;
  }
  if(line) lines.push(line);
  lines=lines.slice(0,maxLines);
  lines.forEach((ln,i)=>ctx.fillText(ln,x,y+i*lineHeight));
  return y+lines.length*lineHeight;
}
async function saveResultImage(){
  if(selected.length!==3) return;
  const c=document.createElement("canvas"); c.width=1080;c.height=1350;
  const ctx=c.getContext("2d");
  const g=ctx.createLinearGradient(0,0,0,1350);g.addColorStop(0,"#250a12");g.addColorStop(.42,"#0c090c");g.addColorStop(1,"#050405");
  ctx.fillStyle=g;ctx.fillRect(0,0,c.width,c.height);
  ctx.strokeStyle="#d8aa4c";ctx.lineWidth=5;ctx.strokeRect(28,28,1024,1294);
  ctx.textAlign="center";ctx.fillStyle="#e8bd61";ctx.font="700 28px serif";ctx.fillText("YOUR HAND",540,90);
  ctx.fillStyle="#fff0c0";ctx.font="900 58px serif";ctx.fillText("人生の手札診断",540,155);
  ctx.fillStyle="#c9bba7";ctx.font="26px sans-serif";ctx.fillText("配られたカードは変えられへん。でも、切り方はあんた次第。",540,205);
  const labels=["生まれつき持ってる札","なぜか腐らせてる札","人生の切り札"];
  const xs=[195,540,885];
  selected.forEach((d,i)=>{
    const x=xs[i];
    ctx.fillStyle="#181116";ctx.strokeStyle="#8f6a35";ctx.lineWidth=3;
    ctx.beginPath();ctx.roundRect(x-150,250,300,760,22);ctx.fill();ctx.stroke();
    ctx.fillStyle="#d7b96d";ctx.font="700 20px sans-serif";ctx.fillText(labels[i],x,295);
    ctx.fillStyle=(d.suit==="♥"||d.suit==="♦")?"#c92a3d":"#f0e5d0";
    ctx.font="900 72px Georgia";
    ctx.fillText((d.rank||"JOKER")+" "+(d.suit||""),x,400);
    ctx.fillStyle="#d5bc7e";ctx.font="700 20px sans-serif";
    const pw=(d.id==="RJ"||d.id==="BJ")?d.power:`${d.power} × ${d.action}`;
    ctx.fillText(pw,x,445);
    ctx.fillStyle="#fff0bf";ctx.font="900 29px sans-serif";wrapText(ctx,d.title,x,495,255,38,2);
    ctx.fillStyle="#eee2d4";ctx.font="22px sans-serif";
    let yy=wrapText(ctx,d.reading,x,585,250,34,6);
    ctx.fillStyle="#ffb0b9";ctx.font="700 20px sans-serif";ctx.fillText("悪いうめこ",x,835);
    ctx.fillStyle="#f3dedf";ctx.font="21px sans-serif";wrapText(ctx,d.bad,x,875,250,32,4);
  });
  ctx.fillStyle="#fff0bf";ctx.font="900 34px sans-serif";ctx.fillText("あんた、ええ手札持ってるやん。",540,1090);
  ctx.fillStyle="#e8bd61";ctx.font="900 44px sans-serif";ctx.fillText("ほな、いつ切るん？",540,1150);
  ctx.fillStyle="#8e8275";ctx.font="18px sans-serif";ctx.fillText("UMEKO ORIGINAL CARD DIAGNOSIS",540,1285);
  const a=document.createElement("a");a.download="jinsei_no_tefuda.PNG";a.href=c.toDataURL("image/png");a.click();
}

$("#start").onclick=()=>{$("#intro").classList.add("hidden");deal();window.scrollTo({top:0,behavior:"smooth"})};
$("#saveResult").onclick=saveResultImage;
$("#again").onclick=()=>{deal();window.scrollTo({top:0,behavior:"smooth"})};
</script>
