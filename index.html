<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09070a">
<title>人生の手札診断</title>
<style>
:root{
  --bg:#09070a; --panel:#151017; --gold:#e8bd61; --gold2:#fff0b0;
  --red:#a30f22; --ink:#f8f1e5; --muted:#bdb3a5;
}
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
  background:
    radial-gradient(circle at 50% 0%,#40101b 0,transparent 34%),
    radial-gradient(circle at 20% 70%,#211425 0,transparent 34%),
    linear-gradient(180deg,#080608,#100a0e 55%,#050405);
}
.wrap{width:min(980px,100%);margin:auto;padding:24px 16px 64px;text-align:center}
.hero{padding:26px 10px 10px}
.kicker{letter-spacing:.24em;color:var(--gold);font-size:.78rem;font-weight:800}
h1{font-family:Georgia,"Yu Mincho",serif;font-size:clamp(2.2rem,10vw,4.8rem);margin:.18em 0 .08em;color:#fff4ce;text-shadow:0 0 25px #a20f26}
.lead{margin:0 auto;max-width:620px;color:#ddd0bd;line-height:1.8}
.quote{margin:18px auto 6px;color:var(--gold2);font-weight:800}
.btn{
  border:1px solid #f0ca73;border-radius:999px;padding:14px 24px;
  background:linear-gradient(180deg,#a9162d,#650815);color:#fff6dc;
  font-size:1rem;font-weight:900;box-shadow:0 8px 26px #0008, inset 0 0 12px #ffb05d33;
  cursor:pointer
}
.btn.secondary{background:#171117;color:#ead8ae}
.hidden{display:none!important}
#intro .mascot{width:min(230px,58vw);height:230px;object-fit:contain;margin:12px auto;display:block}
.stage{margin-top:22px}
.instruction{font-weight:900;color:#f8e5b0;margin-bottom:14px}
.counter{color:var(--gold);margin-bottom:12px;font-weight:800}
.deck{
  display:grid;grid-template-columns:repeat(6,1fr);gap:8px;
  max-width:690px;margin:0 auto
}
.pick{
  aspect-ratio:2/3;border:0;padding:0;border-radius:9px;overflow:hidden;
  background:#20161b;box-shadow:0 5px 14px #000a;cursor:pointer;
  transition:.2s transform,.2s filter,.2s opacity
}
.pick img{width:100%;height:100%;object-fit:cover;display:block}
.pick:hover{transform:translateY(-5px)}
.pick.chosen{filter:brightness(.35);transform:scale(.94);pointer-events:none}
.pick.chosen:after{content:"✓";position:absolute}
@media(max-width:620px){.deck{grid-template-columns:repeat(5,1fr);gap:6px}.wrap{padding-inline:10px}}
.results{margin-top:28px}
.results h2{font-family:Georgia,"Yu Mincho",serif;color:#ffe5a3;font-size:2rem}
.hand{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:stretch}
@media(max-width:760px){.hand{grid-template-columns:1fr}}
.result{
  background:linear-gradient(180deg,#1d151b,#0d0a0c);
  border:1px solid #6f5530;border-radius:20px;padding:16px;
  box-shadow:0 12px 32px #0009;position:relative;overflow:hidden
}
.slot{color:#d7b96d;font-size:.8rem;font-weight:900;letter-spacing:.12em}
.face{
  width:min(190px,70%);aspect-ratio:2/3;margin:12px auto;border-radius:13px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:#f8f2e7;color:#171015;border:5px double #c89a3d;
  box-shadow:0 7px 18px #0008;position:relative
}
.face.red{color:#a40d20}
.face .rank{font-family:Georgia,serif;font-size:4rem;font-weight:900;line-height:.9}
.face .suit{font-size:3.4rem;line-height:1}
.face.joker{padding:0;border:0;background:#000}
.face.joker img{width:100%;height:100%;object-fit:cover;border-radius:13px}
.power{color:#d5bc7e;font-size:.85rem;font-weight:900}
.result h3{font-size:1.35rem;margin:.4em 0;color:#fff0bf}
.reading{line-height:1.75;color:#eee2d4;text-align:left}
.use{background:#21151a;border-left:3px solid var(--gold);padding:10px 12px;border-radius:8px;text-align:left;line-height:1.6}
.bad{margin-top:12px;padding:12px;border-radius:12px;background:#340b13;text-align:left;line-height:1.6}
.bad b{color:#ffb0b9}
.summary{
  margin:20px auto 0;max-width:720px;padding:20px;border:1px solid #9b7437;
  border-radius:18px;background:#100c0e
}
.duo{display:flex;justify-content:center;align-items:end;gap:6px;margin-top:14px}
.duo img{height:130px;max-width:42%;object-fit:contain}
.final{font-size:1.25rem;font-weight:900;line-height:1.8}
.error{
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  color:#ff465f;letter-spacing:.1em;font-weight:900
}
footer{margin-top:36px;color:#776f68;font-size:.72rem}

/* --- UMEKO upgrade: shuffle / flip / sparkle / save --- */
.sparkles{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.spark{position:absolute;width:5px;height:5px;background:#ffe9a4;transform:rotate(45deg);
  box-shadow:0 0 8px #fff1a8,0 0 18px #dca52e;animation:twinkle var(--d) ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.05;transform:scale(.35) rotate(45deg)}50%{opacity:1;transform:scale(1.7) rotate(45deg)}}
.shuffler{max-width:700px;margin:12px auto 22px;padding:18px;border:1px solid #6f5530;border-radius:18px;background:#100b0e}
.shuffle-zone{height:210px;position:relative;display:grid;place-items:center;perspective:900px}
.shuffle-card{position:absolute;width:112px;aspect-ratio:2/3;border-radius:10px;overflow:hidden;box-shadow:0 9px 25px #000b;transition:.18s}
.shuffle-card img{width:100%;height:100%;object-fit:cover}
.shuffler.go .c1{animation:mix1 1.15s ease-in-out}
.shuffler.go .c2{animation:mix2 1.15s ease-in-out}
.shuffler.go .c3{animation:mix3 1.15s ease-in-out}
.shuffler.go .c4{animation:mix4 1.15s ease-in-out}
.shuffler.go .c5{animation:mix5 1.15s ease-in-out}
@keyframes mix1{20%{transform:translate(-115px,-20px) rotate(-18deg)}55%{transform:translate(85px,20px) rotate(12deg)}100%{transform:none}}
@keyframes mix2{20%{transform:translate(105px,-15px) rotate(16deg)}55%{transform:translate(-80px,28px) rotate(-11deg)}100%{transform:none}}
@keyframes mix3{25%{transform:translate(-65px,38px) rotate(-9deg)}60%{transform:translate(120px,-22px) rotate(20deg)}100%{transform:none}}
@keyframes mix4{25%{transform:translate(75px,42px) rotate(10deg)}60%{transform:translate(-120px,-25px) rotate(-20deg)}100%{transform:none}}
@keyframes mix5{35%{transform:translateY(-45px) rotate(180deg)}75%{transform:translateY(25px) rotate(360deg)}100%{transform:none}}
.pick{position:relative}
.pick::before{content:"";position:absolute;inset:-80% -120%;background:linear-gradient(115deg,transparent 42%,#fff8cfdd 49%,transparent 56%);transform:translateX(-60%);transition:.2s;z-index:2}
.pick:hover::before{animation:cardshine .75s ease}
@keyframes cardshine{to{transform:translateX(65%)}}
.reveal-overlay{position:fixed;inset:0;z-index:80;background:#050306eF;display:grid;place-items:center;padding:20px}
.reveal-card{width:min(330px,78vw);aspect-ratio:2/3;perspective:1200px;filter:drop-shadow(0 0 30px #b11234)}
.reveal-inner{width:100%;height:100%;position:relative;transform-style:preserve-3d;animation:flipwow 1.15s cubic-bezier(.2,.8,.2,1) forwards}
.reveal-side{position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;overflow:hidden;box-shadow:0 0 55px #e7bd5b99}
.reveal-back img,.reveal-joker img{width:100%;height:100%;object-fit:cover}
.reveal-front{transform:rotateY(180deg);background:radial-gradient(circle,#fffaf0,#e9dcc4);display:flex;align-items:center;justify-content:center;border:8px double #c99a3c}
.reveal-front.red{color:#a40d20}.reveal-front.black{color:#111}
.reveal-front .big{font-family:Georgia,serif;font-size:clamp(5rem,25vw,8rem);font-weight:900;line-height:.8}
.reveal-front .bigSuit{font-size:clamp(4rem,20vw,7rem);line-height:1}
@keyframes flipwow{0%{transform:rotateY(0) scale(.75)}45%{transform:rotateY(540deg) scale(1.08)}100%{transform:rotateY(900deg) scale(1)}}
.flash{position:fixed;inset:0;z-index:79;pointer-events:none;background:radial-gradient(circle,#fff9d8 0,#d9a63088 15%,transparent 50%);animation:flash .9s ease forwards}
@keyframes flash{0%{opacity:0}35%{opacity:1}100%{opacity:0}}
.result{animation:rise .6s ease both}
.result:nth-child(2){animation-delay:.12s}.result:nth-child(3){animation-delay:.24s}
@keyframes rise{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
.result::after{content:"";position:absolute;top:-70%;left:-120%;width:80%;height:240%;background:linear-gradient(100deg,transparent,#fff2a72b,transparent);transform:rotate(15deg);animation:sweep 4s ease-in-out infinite}
@keyframes sweep{0%,55%{left:-120%}85%,100%{left:160%}}
.action-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.save-note{font-size:.75rem;color:#aa9d8b;margin-top:8px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}

/* v3 */
.floating-mascot{position:fixed;z-index:45;top:calc(72px + env(safe-area-inset-top));width:clamp(70px,17vw,135px);pointer-events:none;
 filter:drop-shadow(0 8px 14px #0009)}
.float-normal{left:2px;animation:bobA 2.4s ease-in-out infinite}
.float-bad{right:2px;animation:bobB 2s ease-in-out infinite}
@keyframes bobA{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-15px) rotate(4deg)}}
@keyframes bobB{0%,100%{transform:translateY(-5px) rotate(4deg)}50%{transform:translateY(-22px) rotate(-5deg)}}
.shuffler.loop .c1{animation:mix1 .75s ease-in-out infinite}
.shuffler.loop .c2{animation:mix2 .68s ease-in-out infinite}
.shuffler.loop .c3{animation:mix3 .82s ease-in-out infinite}
.shuffler.loop .c4{animation:mix4 .72s ease-in-out infinite}
.shuffler.loop .c5{animation:mix5 .9s ease-in-out infinite}
.stopbtn{background:linear-gradient(180deg,#d6aa43,#80601d);color:#160e08}
.save-card{margin:16px auto 0;max-width:720px;background:linear-gradient(180deg,#21141a,#0b080a);
 border:2px solid #a77d38;border-radius:22px;padding:22px 14px;box-shadow:0 0 30px #b7862c22}
.save-title{font-family:Georgia,"Yu Mincho",serif;color:#fff0bd;font-size:1.9rem;font-weight:900}
.save-sub{color:#d4bc7d;margin:5px 0 16px;font-weight:800}
.save-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.save-mini{border:1px solid #72562f;border-radius:14px;padding:12px 7px;background:#130e11;min-width:0}
.save-mini .cardcode{font:900 2.1rem Georgia,serif;color:#fff0c0}
.save-mini .cardcode.red{color:#ff6575}
.save-mini h4{margin:8px 0;color:#fff0bd;font-size:1rem}
.save-mini p{margin:6px 0;line-height:1.45;font-size:.8rem;color:#e8ddd0}
.save-mini .devil{color:#ffabb5}
@media(max-width:520px){.save-grid{grid-template-columns:1fr}.save-mini p{font-size:.9rem}}

.save-preview{
  position:fixed; inset:0; z-index:120; background:#050306f2;
  display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
  padding:calc(18px + env(safe-area-inset-top)) 14px 30px; overflow:auto;
}
.save-preview img{
  display:block; width:min(92vw,720px); height:auto; margin:10px auto;
  border-radius:18px; border:2px solid #b78a3f;
  box-shadow:0 0 38px #d2a64655;
  -webkit-touch-callout:default; user-select:auto;
}
.save-preview .guide{
  max-width:720px; color:#fff0c0; font-weight:900; line-height:1.7;
}
.save-preview .closePreview{margin:8px 0 18px}

.deepread{margin-top:12px;text-align:left;display:grid;gap:8px}
.deepbox{padding:10px 12px;border-radius:10px;background:#171116;border:1px solid #4f3d2b;line-height:1.65}
.deepbox b{color:#e5c678}
.deepbox.warn{background:#211015;border-color:#6b3039}
.deepbox.warn b{color:#ff9fac}

.combo-reading{margin:20px auto 0;max-width:760px;padding:22px 16px;border-radius:20px;
 background:radial-gradient(circle at 50% 0,#38121c,#100b0e 58%);
 border:1px solid #b78a3f;box-shadow:0 0 30px #b7862c22;text-align:left}
.combo-reading h3{text-align:center;color:#fff0bd;font:900 1.65rem Georgia,"Yu Mincho",serif;margin:0 0 6px}
.combo-tag{text-align:center;color:#d8b85e;font-weight:900;margin-bottom:15px}
.combo-reading p{line-height:1.8;color:#eee1d1}
.combo-punch{margin-top:14px;padding:13px;border-radius:12px;background:#330b13;color:#ffd9dd;font-weight:800;line-height:1.7}
</style>
</head>
<body><div class="sparkles" id="sparkles"></div>
<img class="floating-mascot float-normal" src="umeko.PNG" alt="">
<img class="floating-mascot float-bad" src="bad_umeko.PNG" alt="">
<main class="wrap">
<section id="intro" class="hero">
  <div class="kicker">UMEKO ORIGINAL CARD DIAGNOSIS</div>
  <h1>人生の手札診断</h1>
  <p class="lead">配られたカードに文句言う前に、手札見よか。<br>直感で3枚。あんたが持ってる武器、腐らせてる武器、最後の切り札を暴きます。</p>
  <img class="mascot" src="umeko.PNG" alt="うめこ">
  <div class="quote">配られたカードは変えられへん。<br>でも、切り方はあんた次第。</div>
  <button class="btn" id="start">手札を配ってもらう</button>
</section>

<section id="game" class="stage hidden">
  <div class="shuffler" id="shuffler">
    <div class="instruction">まずは54枚、派手に混ぜます。</div>
    <div class="shuffle-zone">
      <div class="shuffle-card c1"><img src="card_back.PNG"></div>
      <div class="shuffle-card c2"><img src="card_back.PNG"></div>
      <div class="shuffle-card c3"><img src="card_back.PNG"></div>
      <div class="shuffle-card c4"><img src="card_back.PNG"></div>
      <div class="shuffle-card c5"><img src="card_back.PNG"></div>
    </div>
    <button class="btn" id="shuffleBtn">🃏 シャッフル開始</button>
    <button class="btn stopbtn hidden" id="stopShuffle">ここや！ストップ</button>
    <div id="shuffleMsg" style="margin-top:10px;color:#d7bd7c;font-weight:800">好きなだけ混ぜてな。</div>
  </div>
  <div id="pickArea" class="hidden">
    <div class="instruction">考えすぎ禁止。直感で3枚選んでな。</div>
    <div class="counter" id="counter">0 / 3 枚</div>
    <div class="deck" id="deck"></div>
  </div>
</section>

<section id="results" class="results hidden">
  <div class="kicker">YOUR HAND</div>
  <h2>あんたの人生の手札</h2>
  <div class="hand" id="hand"></div>
  <div class="combo-reading" id="comboReading"></div><div class="summary" id="summary"></div>
  <div id="saveCard" class="save-card"></div><div class="action-row">
    <button class="btn" id="saveResult">保存用画像を作る</button>
    <button class="btn secondary" id="again">もう一回、配り直す</button>
  </div>
  <div class="save-note">iPhone対応：画像を作ったら、表示された画像を長押し →「写真に保存」してな。</div>
</section>
<footer>※遊びとして楽しむオリジナル診断です。結果は人生の決定を代わりにするものではありません。</footer>
</main>

<script>
const IMG={
  normal:"umeko.PNG", bad:"bad_umeko.PNG", back:"card_back.PNG",
  redJoker:"red_joker.PNG", blackJoker:"black_joker.PNG"
};
const suitInfo={
  "♥":{key:"heart",power:"惹きつける力",color:"red"},
  "♦":{key:"diamond",power:"価値にする力",color:"red"},
  "♣":{key:"club",power:"動かす力",color:"black"},
  "♠":{key:"spade",power:"見抜く力",color:"black"}
};
const data={
"♥":[
["A","始める","縁の火付け役","初対面でも自然に関係を始められる。","新しい出会いや、止まっている人間関係を動かしたい時。","待ってても誰も玄関まで来ぇへんで"],
["2","つなぐ","ご縁の接着剤","人と人を結びつけるのが得意。","人同士を紹介したり、チームの橋渡しをする時。","何でもくっつけたらええ訳ちゃう"],
["3","広げる","愛嬌拡散機","楽しさを周囲へ広げ、人を集める。","場を明るくしたい時や、仲間を増やしたい時。","喋りすぎて本題どっか行ってるで"],
["4","固める","安心基地","信頼関係をじっくり築ける。","長く続く関係や居場所を作る時。","居心地よすぎて便利屋になるな"],
["5","変える","空気チェンジャー","場の空気や人の気持ちを切り替える。","重たい空気を変えたい時や、新風を入れたい時。","空気読みすぎて自分まで変身すな"],
["6","育てる","愛情育成係","人の良さを見つけて伸ばせる。","誰かを支えたり、関係を育てる時。","世話焼きとお節介は隣同士や"],
["7","掘る","本音発掘人","表面ではなく心の奥に触れられる。","本音を知りたい時や、深い対話が必要な時。","聞いてない秘密まで掘るな"],
["8","動かす","巻き込み磁石","人の心を動かして行動につなげる。","一人では動かない企画を前へ進める時。","全員連れて行こうとすな"],
["9","極める","愛され職人","人との関係を深く成熟させられる。","大切な縁を長く育てたい時。","好かれる努力まで始めたら迷子や"],
["10","完成させる","ご縁の仕上げ人","バラバラな人間関係を一つにまとめる。","チームや集まりを一つに着地させる時。","最後の尻拭いまで担当せんでええ"],
["J","攻める","懐突入型","距離を縮める度胸と瞬発力がある。","初対面や勝負どころで一気に距離を縮める時。","土足で入ったらただの不審者や"],
["Q","魅せる","天然人たらし","存在感や愛嬌そのものが魅力になる。","自分自身を前に出したい時。","全員に好かれようとしたら勤務時間24時間や"],
["K","率いる","人心掌握役","信頼によって人をまとめられる。","人の気持ちを大事にしながら先頭に立つ時。","王様ちゃう。ちゃんと人の話聞け"]
],
"♦":[
["A","始める","ゼロイチ錬金術師","何もないところから価値の種を生み出す。","新商品、新企画、新しい仕事を始める時。","思いついた瞬間だけ社長になるな"],
["2","つなぐ","価値の仲人","別々のものを組み合わせ、新しい価値を作る。","異なる得意や素材を掛け合わせる時。","何でもコラボしたらええ訳ちゃう"],
["3","広げる","才能拡声器","良いものを見つけ、魅力が伝わる形に広げる。","発信、紹介、PRで価値を届ける時。","宣伝する前に中身確認したか"],
["4","固める","土台職人","アイデアを安定して続く形にできる。","仕組みや基盤を整える時。","固めすぎて化石にすな"],
["5","変える","価値変換機","一見ムダなものにも別の使い道を見つける。","行き詰まったものを別角度から活かす時。","何でも『使える』で捨てへんから家パンパンや"],
["6","育てる","才能育成家","小さな可能性を時間をかけて価値に変える。","未完成の才能や企画を育てる時。","芽ぇ出てない鉢に水3リットルやるな"],
["7","掘る","お宝発掘人","人が見逃す価値や才能を見つけ出す。","埋もれた強みや素材を探す時。","掘りすぎて別の趣味始めてるで"],
["8","動かす","価値の実行屋","才能やアイデアを実際の成果へ動かせる。","考えていたものを現実に出す時。","思いついた翌日に販売開始すな"],
["9","極める","一芸錬成師","得意分野を磨き、代わりのない価値にできる。","一つの技術や専門性を磨く時。","極める前に次のん見つけんな"],
["10","完成させる","商品化職人","アイデアを人に渡せる完成形まで仕上げる。","作品やサービスを世に出せる形にする時。","完成したのにまた改装始めるな"],

function shuffle(a){
  a=[...a];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
  return a;
}

function revealCard(c,n,done){
  burstSparkles();
  const o=document.createElement("div"); o.className="reveal-overlay";

  if(c.id==="RJ"||c.id==="BJ"){
    front=`<div class="reveal-side reveal-front reveal-joker"><img src="${c.img}" alt="${c.name}"></div>`;

    front=`<div class="reveal-side reveal-front ${col}"><div><div class="big">${c.rank}</div><div class="bigSuit">${c.suit}</div></div></div>`;

function makeSparkles(){
  const box=$("#sparkles");
  for(let i=0;i<30;i++){
    const x=document.createElement("i"); x.className="spark";
    x.style.left=Math.random()*100+"%"; x.style.top=Math.random()*100+"%";
    x.style.setProperty("--d",(1.4+Math.random()*3)+"s");
    x.style.animationDelay=(-Math.random()*3)+"s";
    box.appendChild(x);
  }
}

function buildCombo(sel){
  const powers=sel.map(c=>{
    if(c.id==="RJ") return "規格外";
    if(c.id==="BJ") return "逆転";
    return c.suit;
  });
  const hasRJ=sel.some(c=>c.id==="RJ"), hasBJ=sel.some(c=>c.id==="BJ");
  const labels={"♥":"人を惹きつける","♦":"価値へ変える","♣":"現実を動かす","♠":"本質を見抜く","規格外":"常識を壊す","逆転":"崩れてからひっくり返す"};
  const a=labels[powers[0]], b=labels[powers[1]], c=labels[powers[2]];
  let tag="", body="", punch="";
  if(hasRJ && hasBJ){
    tag="分類不能型｜人生そのものがワイルドカード";
    body=`あんたの土台には「${a}力」がある。ところが眠らせている札と最後の切り札にJOKER級の揺さぶりが入る組み合わせ。決められた正解に合わせるより、状況ごと作り替えた時に強さが出る。`;
    punch="悪いうめこ総評：普通の攻略本、たぶん途中で捨てるタイプや。";
  }else if(hasRJ || hasBJ){
    tag="JOKER混入型｜予定通りでは終わらん";
    body=`最初の武器は「${a}力」。そこへ「${b}力」をどう扱うかが途中の課題になり、最後は「${c}力」で勝負する流れ。JOKERが混じるぶん、人生の節目では予定変更や独自路線が大きな転機になりやすい手札や。`;
    punch="悪いうめこ総評：予定表は持っとけ。ただし予定表どおりになるとは思うな。";
  }else{
    const same=new Set(powers).size;
    if(same===1){
      tag=`一点突破型｜${labels[powers[0]]}力が主役`;
      body=`3枚とも同じ系統。これは「${a}力」を、生まれつきの武器・眠らせている課題・最後の切り札まで一貫して使う手札。得意がハッキリしているぶん、使いすぎた時のクセにも気づけたらかなり強い。`;
      punch="悪いうめこ総評：得意なんは分かった。得意一本で全部殴ろうとすな。";
    }else if(same===2){
      tag="二刀流型｜得意が濃い";
      body=`あんたは「${a}力」を土台に持ち、「${b}力」をまだ十分使い切れていない。そして勝負どころでは「${c}力」が前に出る。似た力が2枚あるぶん得意分野は濃いけど、残り1枚を使えるようになると手札の幅が一気に広がる。`;
      punch="悪いうめこ総評：同じ武器2本持って安心すな。もう1本も抜け。";
    }else{
      tag="三刀流型｜役割の違う3枚持ち";
      body=`生まれつきは「${a}力」。でも今眠らせているのは「${b}力」。そして、ここぞという時に効くのが「${c}力」。3枚の役割が全部違うから、ひとつの得意だけで押すより「人・価値・行動・判断」を場面ごとに切り替えた時に強い手札や。`;
      punch="悪いうめこ総評：札は揃ってる。問題は、出す順番や。";
    }
  }
  return {tag,body,punch};
}

function wrapText(ctx,text,x,y,maxWidth,lineHeight,maxLines=4){
  let line="", lines=[];
  for(const ch of text){
    const test=line+ch;
    if(ctx.measureText(test).width>maxWidth && line){lines.push(line);line=ch}else line=test;
  }
  if(line) lines.push(line);
  lines=lines.slice(0,maxLines);
  lines.forEach((ln,i)=>ctx.fillText(ln,x,y+i*lineHeight));
  return y+lines.length*lineHeight;
}

  const ctx=c.getContext("2d");

  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,"#2b0812"); bg.addColorStop(.35,"#120b10"); bg.addColorStop(1,"#050405");
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);

  // decorative glow
  const glow=ctx.createRadialGradient(540,120,10,540,120,520);
  glow.addColorStop(0,"rgba(190,35,63,.38)"); glow.addColorStop(1,"rgba(190,35,63,0)");
  ctx.fillStyle=glow; ctx.fillRect(0,0,W,620);

  ctx.strokeStyle="#d4a64d"; ctx.lineWidth=5; ctx.strokeRect(28,28,1024,2144);
  ctx.strokeStyle="#6e512a"; ctx.lineWidth=2; ctx.strokeRect(42,42,996,2116);

  ctx.textAlign="center";
  ctx.fillStyle="#e8bd61"; ctx.font="700 27px serif"; ctx.fillText("YOUR HAND",540,86);
  ctx.fillStyle="#fff0c0"; ctx.font="900 61px serif"; ctx.fillText("人生の手札診断",540,154);
  ctx.fillStyle="#c9bba7"; ctx.font="25px sans-serif";
  ctx.fillText("配られたカードは変えられへん。でも、切り方はあんた次第。",540,204);

  const labels=["生まれつき持ってる札","なぜか腐らせてる札","人生の切り札"];
  const xs=[190,540,890];

  function roundRect(x,y,w,h,r,fill,stroke){
    ctx.beginPath(); ctx.roundRect(x,y,w,h,r);
    if(fill) ctx.fill(); if(stroke) ctx.stroke();
  }
  function drawWrapped(text,x,y,maxWidth,lineHeight,maxLines,font,fill){
    ctx.font=font; ctx.fillStyle=fill; ctx.textAlign="center";
    let line="", lines=[];
    for(const ch of text){
      const test=line+ch;
      if(ctx.measureText(test).width>maxWidth && line){lines.push(line); line=ch}else line=test;
    }
    if(line) lines.push(line);
    lines=lines.slice(0,maxLines);
    lines.forEach((ln,i)=>ctx.fillText(ln,x,y+i*lineHeight));
    return y+lines.length*lineHeight;
  }

  selected.forEach((d,i)=>{
    const x=xs[i], left=x-155, top=250;
    ctx.fillStyle="#151015"; ctx.strokeStyle="#8f6a35"; ctx.lineWidth=3;
    roundRect(left,top,310,1180,22,true,true);

    ctx.fillStyle="#d7b96d"; ctx.font="700 20px sans-serif"; ctx.textAlign="center";
    ctx.fillText(labels[i],x,292);

    const isJ=d.id==="RJ"||d.id==="BJ";
    const red=d.suit==="♥"||d.suit==="♦"||d.id==="RJ";
    ctx.fillStyle=red?"#ff5d70":"#f3e7d2";
    ctx.font=isJ?"900 35px Georgia":"900 76px Georgia";
    ctx.fillText(isJ?d.name:`${d.rank} ${d.suit}`,x,395);

    ctx.fillStyle="#d5bc7e"; ctx.font="700 19px sans-serif";
    drawWrapped(isJ?d.power:`${d.power} × ${d.action}`,x,447,270,28,2,"700 19px sans-serif","#d5bc7e");

    drawWrapped(d.title,x,515,270,38,2,"900 29px sans-serif","#fff0bf");
    drawWrapped(d.reading,x,615,266,34,6,"22px sans-serif","#eee2d4");

    const ex=extraFor(d);
    ctx.fillStyle="#e5c678"; ctx.font="700 19px sans-serif"; ctx.fillText("この手札の正体",x,855);
    drawWrapped(ex.core,x,892,265,29,5,"19px sans-serif","#eee2d4");
    ctx.fillStyle="#e5c678"; ctx.font="700 19px sans-serif"; ctx.fillText("うまく切れたら",x,1050);
    drawWrapped(ex.shine,x,1087,265,29,5,"19px sans-serif","#eee2d4");
    ctx.fillStyle="#ff9fac"; ctx.font="700 19px sans-serif"; ctx.fillText("腐らせると",x,1242);
    drawWrapped(ex.shadow,x,1279,265,29,5,"19px sans-serif","#f3dedf");
    ctx.fillStyle="#ffabb5"; ctx.font="700 20px sans-serif"; ctx.fillText("😈 悪いうめこ",x,1425);
    drawWrapped(d.bad,x,1462,265,30,4,"20px sans-serif","#f3dedf");
  });

  const combo=buildCombo(selected);
  ctx.fillStyle="#1b1015"; ctx.strokeStyle="#a77d38"; ctx.lineWidth=3;
  roundRect(245,1580,590,350,20,true,true);
  ctx.fillStyle="#fff0bd"; ctx.font="900 31px sans-serif"; ctx.textAlign="center";
  ctx.fillText("3枚合わせたら、あんた何者？",540,1630);
  ctx.fillStyle="#d8b85e"; ctx.font="800 23px sans-serif";
  drawWrapped(combo.tag,540,1675,520,31,2,"800 23px sans-serif","#d8b85e");
  drawWrapped(combo.body,540,1750,520,30,5,"20px sans-serif","#eee1d1");
  drawWrapped("😈 "+combo.punch,540,1905,520,29,3,"700 19px sans-serif","#ffb7c0");

  // Mascots in saved image
  async function loadPic(src){
    return new Promise((resolve,reject)=>{const im=new Image(); im.onload=()=>resolve(im); im.onerror=reject; im.src=src;});
  }
  try{
    const [u,bad]=await Promise.all([loadPic(IMG.normal),loadPic(IMG.bad)]);
    ctx.drawImage(u,55,1650,175,175);
    ctx.drawImage(bad,850,1650,175,175);
  }catch(e){}

  ctx.fillStyle="#fff0bf"; ctx.font="900 34px sans-serif"; ctx.textAlign="center";
  ctx.fillText("あんた、ええ手札持ってるやん。",540,2020);
  ctx.fillStyle="#e8bd61"; ctx.font="900 44px sans-serif";
  ctx.fillText("ほな、いつ切るん？",540,2075);
  ctx.fillStyle="#8e8275"; ctx.font="18px sans-serif";
  ctx.fillText("UMEKO ORIGINAL CARD DIAGNOSIS",540,2150);

  // iPhone: show the actual PNG and save by long press.
  const png=c.toDataURL("image/png");
  const overlay=document.createElement("div");
  overlay.className="save-preview";
  overlay.innerHTML=`
    <div class="guide">うめこ＆悪いうめこ入りで、できたで🤣<br>
    ↓ この画像を <b>長押し</b> →「写真に保存」してな。<br>
    <span style="font-size:.82rem;color:#cbbba5">Safariでメニューが出にくい時は画像を一度タップしてから長押し。</span></div>
    <img src="${png}" alt="人生の手札診断 保存用画像">
    <button class="btn secondary closePreview">診断に戻る</button>`;
  document.body.appendChild(overlay);
  overlay.querySelector(".closePreview").onclick=()=>overlay.remove();
}

$("#start").onclick=()=>{$("#intro").classList.add("hidden");deal();window.scrollTo({top:0,behavior:"smooth"})};
$("#saveResult").onclick=saveResultImage;
$("#again").onclick=()=>{deal();window.scrollTo({top:0,behavior:"smooth"})};
</script>
</body>
</html>
